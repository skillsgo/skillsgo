<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;overflow:hidden}
#mermaid-host{box-sizing:border-box;width:100%;padding:16px;text-align:center}
#mermaid-host svg{display:inline-block;max-width:100%;height:auto}
</style></head><body><div id="mermaid-host"></div>
<script src="mermaid-11.16.0.min.js"></script><script>
async function rasterize(svg){const rect=svg.getBoundingClientRect();const width=Math.max(1,Math.ceil(rect.width));const height=Math.max(1,Math.ceil(rect.height));const scale=Math.min(2,2400/width);const canvas=document.createElement('canvas');canvas.width=Math.ceil(width*scale);canvas.height=Math.ceil(height*scale);const context=canvas.getContext('2d');context.scale(scale,scale);const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);try{const image=await new Promise((resolve,reject)=>{const value=new Image();value.onload=()=>resolve(value);value.onerror=reject;value.src=url;});context.drawImage(image,0,0,width,height);return canvas.toDataURL('image/png').split(',')[1];}finally{URL.revokeObjectURL(url);}}
function replaceForeignObjects(svg,foreground){for(const element of [...svg.querySelectorAll('foreignObject')]){const text=document.createElementNS('http://www.w3.org/2000/svg','text');const x=parseFloat(element.getAttribute('x')||'0');const y=parseFloat(element.getAttribute('y')||'0');const width=parseFloat(element.getAttribute('width')||'0');const height=parseFloat(element.getAttribute('height')||'0');text.setAttribute('x',String(x+width/2));text.setAttribute('y',String(y+height/2));text.setAttribute('fill',foreground);text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','middle');text.setAttribute('font-family','-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif');text.setAttribute('font-size','16');text.textContent=element.textContent.trim().replace(/\s+/g,' ');element.replaceWith(text);}}
async function renderMermaid(source,colors){
document.documentElement.style.background=colors.background;document.body.style.background=colors.background;
const host=document.getElementById('mermaid-host');host.innerHTML='';
mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',flowchart:{htmlLabels:false},themeVariables:{background:colors.background,primaryColor:colors.background,primaryTextColor:colors.foreground,primaryBorderColor:colors.primary,lineColor:colors.muted,secondaryColor:colors.background,tertiaryColor:colors.background,fontFamily:'-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'}});
try{const result=await mermaid.render('mermaid-output',source);host.innerHTML=result.svg;requestAnimationFrame(async()=>{const svg=host.querySelector('svg');replaceForeignObjects(svg,colors.foreground);const png=await rasterize(svg);MermaidHost.postMessage(JSON.stringify({height:Math.ceil(host.scrollHeight),png}));});}
catch(error){MermaidHost.postMessage(JSON.stringify({error:String(error?.message||error)}));}}
</script></body></html>

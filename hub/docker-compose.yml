# [INPUT]: Depends on the repository Go workspace, Hub development services, and container build definitions.
# [OUTPUT]: Provides the local Hub development, unit-test, and integration-test topology, including PostgreSQL plus S3, Azure Blob, and GCS test services.
# [POS]: Serves as the Docker Compose entry point for the Hub workspace and its supporting services.
# [PROTOCOL]: Update this header when this file changes, then review AGENTS.md
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: skillsgo_hub
      POSTGRES_USER: skillsgo
      POSTGRES_PASSWORD: skillsgo-dev
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsgo -d skillsgo_hub"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - skillsgo-postgres:/var/lib/postgresql

  dev:
    build:
      context: ..
      dockerfile: hub/cmd/skillsgo-hub/Dockerfile
      args:
        GOLANG_VERSION: "1.26.2"
    environment:
      - SKILLSGO_HUB_STORAGE_TYPE=disk
      - SKILLSGO_HUB_TRACE_EXPORTER=otlp
      - SKILLSGO_HUB_TRACE_EXPORTER_URL=http://jaeger:4317
    ports:
      - 3000:3000
    depends_on:
      - jaeger
  testunit:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        GOLANG_VERSION: "1.26.2"
    command: ["./scripts/test_unit.sh"]
    environment:
      - SKILLSGO_HUB_ENVIRONMENT=test
      - SKILLSGO_TEST_S3_ENDPOINT=http://localstack:4566
      - SKILLSGO_TEST_S3_ACCESS_KEY_ID=test
      - SKILLSGO_TEST_S3_SECRET_ACCESS_KEY=test
      - SKILLSGO_TEST_S3_BUCKET_NAME=skillsgo-storage-compliance
      - SKILLSGO_TEST_S3_REGION=us-east-1
      - SKILLSGO_TEST_S3_FORCE_PATH_STYLE=true
      - SKILLSGO_TEST_S3_CREATE_BUCKET=true
      - SKILLSGO_TEST_AZURE_BLOB_ENDPOINT=http://azurite:10000/devstoreaccount1
      - SKILLSGO_TEST_AZURE_ACCOUNT_NAME=devstoreaccount1
      - SKILLSGO_TEST_AZURE_ACCOUNT_KEY=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      - STORAGE_EMULATOR_HOST=http://fake-gcs-server:4443
      - GCS_PROJECT_ID=skillsgo-test
    depends_on:
      azurite:
        condition: service_started
      fake-gcs-server:
        condition: service_started
      localstack:
        condition: service_healthy
  teste2e:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        GOLANG_VERSION: "1.26.2"
    command: ["./scripts/test_e2e.sh"]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--disableProductStyleUrl"]
    ports:
      - "10000:10000"
  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.54.0
    command: ["-scheme", "http", "-port", "4443", "-public-host", "fake-gcs-server:4443"]
    ports:
      - "4443:4443"
  # Pinned to the final release of the archived Apache-2.0 repository.
  # LocalStack is test infrastructure only; production S3 and R2 use real endpoints.
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 30
  jaeger:
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9441
      - COLLECTOR_OTLP_ENABLED=true
    image: jaegertracing/all-in-one:latest
    ports:
      - 4317:4317   # OTLP gRPC
      - 4318:4318   # OTLP HTTP
      - 14268:14268
      - 9411:9411
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686
  redis:
    image: redis
    ports:
      - 6379:6379
  redis-sentinel:
    image: bitnamilegacy/redis-sentinel
    environment:
      - REDIS_MASTER_HOST=redis
      - REDIS_MASTER_SET=redis-1
      - REDIS_SENTINEL_PASSWORD=sekret
      - REDIS_SENTINEL_QUORUM=1
    ports:
      - 26379:26379
    depends_on:
      - "redis"
  protectedredis:
    image: redis
    ports:
      - "6380:6380"
    volumes:
      - "./test/redis.conf:/usr/local/etc/redis/redis.conf"
    entrypoint: ["redis-server", "/usr/local/etc/redis/redis.conf"]
  etcd0:
    image: quay.io/coreos/etcd
    ports:
      - "2379:2379"
    volumes:
      - etcd0:/etcd_data
    command:
      - /usr/local/bin/etcd
      - -name
      - etcd0
      - --data-dir
      - /etcd_data
      - -advertise-client-urls
      - http://etcd0:2379
      - -listen-client-urls
      - http://0.0.0.0:2379
      - -initial-advertise-peer-urls
      - http://etcd0:2380
      - -listen-peer-urls
      - http://0.0.0.0:2380
      - -initial-cluster
      - etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
  etcd1:
    image: quay.io/coreos/etcd
    ports:
      - "22379:2379"
    volumes:
      - etcd1:/etcd_data
    command:
      - /usr/local/bin/etcd
      - -name
      - etcd1
      - --data-dir
      - /etcd_data
      - -advertise-client-urls
      - http://etcd1:2379
      - -listen-client-urls
      - http://0.0.0.0:2379
      - -initial-advertise-peer-urls
      - http://etcd1:2380
      - -listen-peer-urls
      - http://0.0.0.0:2380
      - -initial-cluster
      - etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
  etcd2:
    image: quay.io/coreos/etcd
    ports:
      - "32379:2379"
    volumes:
      - etcd2:/etcd_data
    command:
      - /usr/local/bin/etcd
      - -name
      - etcd2
      - --data-dir
      - /etcd_data
      - -advertise-client-urls
      - http://etcd2:2379
      - -listen-client-urls
      - http://0.0.0.0:2379
      - -initial-advertise-peer-urls
      - http://etcd2:2380
      - -listen-peer-urls
      - http://0.0.0.0:2380
      - -initial-cluster
      - etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380

volumes:
  skillsgo-postgres:
  etcd0:
  etcd1:
  etcd2:

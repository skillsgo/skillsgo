# [INPUT]: Depends on the App, Protocol, CLI, Hub, App/CLI E2E validation commands, Flutter and Go toolchains, and OSV-supported dependency lockfiles.
# [OUTPUT]: Validates every public workspace and exposes one stable Required job for repository rulesets.
# [POS]: Serves as the repository-wide continuous integration workflow.
# [PROTOCOL]: Update this header when this file changes, then review AGENTS.md
name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-vulnerabilities:
    name: Dependencies (OSV)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      fail-on-vuln: true
      upload-sarif: false

  go:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [protocol, cli, hub]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: ${{ matrix.workspace }}/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l ${{ matrix.workspace }})"
      - name: Test
        run: make test-${{ matrix.workspace }}

  cli-release-candidate:
    name: CLI Candidate (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            cli/go.sum
            protocol/go.sum
      - name: Build standalone candidate
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: ./scripts/build-cli-release.sh v0.0.0 "${{ matrix.goos }}" "${{ matrix.goarch }}" "$RUNNER_TEMP"

  e2e-cli:
    name: CLI E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            e2e/cli/go.sum
            cli/go.sum
            hub/go.sum
            protocol/go.sum
      - name: Run journeys
        run: make test-e2e-cli

  app:
    name: App
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  app-desktop:
    name: App Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            target: macos
            architecture: arm64
          - name: macOS x64
            runner: macos-14
            target: macos
            architecture: x86_64
          - name: Linux x64
            runner: ubuntu-24.04
            target: linux
            architecture: x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: cli/go.sum
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: false
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build architecture-specific macOS App
        if: matrix.target == 'macos'
        run: make build-app-macos-${{ matrix.architecture }}
      - name: Build Linux App
        if: matrix.target == 'linux'
        working-directory: app
        run: flutter build linux --release
      - name: Run bundled CLI smoke journey
        working-directory: app
        run: |
          if [[ "${{ matrix.target }}" == "linux" ]]; then
            xvfb-run -a flutter test -d linux integration_test/bundled_cli_smoke_test.dart
           else
             flutter test -d "${{ matrix.target }}" integration_test/bundled_cli_smoke_test.dart
          fi
      - name: Upload App artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillsgo-app-${{ matrix.target }}-${{ matrix.architecture }}
          path: |
            app/build/macos-${{ matrix.architecture }}/Build/Products/Release/SkillsGo.app
            app/build/linux/x64/release/bundle
          if-no-files-found: error

  required:
    name: Required
    if: always()
    runs-on: ubuntu-24.04
    needs: [dependency-vulnerabilities, go, cli-release-candidate, e2e-cli, app, app-desktop]
    steps:
      - name: Require successful jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success success success"

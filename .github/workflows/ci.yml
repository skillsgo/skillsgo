# [INPUT]: Depends on the Protocol, CLI, Hub, App, Web, cross-product E2E validation commands, and OSV's supported dependency lockfiles.
# [OUTPUT]: Provides stable validation, four-target desktop build/smoke coverage, architecture-specific macOS candidate artifacts on main, and blocking known-vulnerability enforcement for every maintained product boundary.
# [POS]: Serves as the repository-wide continuous integration workflow and exposes one stable Required job for repository rulesets.
# [PROTOCOL]: Update this header when this file changes, then review AGENTS.md
name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-vulnerabilities:
    name: Dependencies (OSV)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      fail-on-vuln: true
      upload-sarif: false

  protocol:
    name: Protocol (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.12', '1.26.5']
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            protocol/go.sum

      - name: Create compatibility workspace
        run: |
          cd "$RUNNER_TEMP"
          go work init "$GITHUB_WORKSPACE/protocol"
          echo "GOWORK=$RUNNER_TEMP/go.work" >> "$GITHUB_ENV"

      - name: Check formatting
        run: test -z "$(gofmt -l protocol)"

      - name: Test coverage contract
        run: make test-protocol

  cli:
    name: CLI (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.12', '1.26.5']
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            cli/go.sum
            protocol/go.sum

      - name: Create compatibility workspace
        run: |
          cd "$RUNNER_TEMP"
          go work init "$GITHUB_WORKSPACE/cli"
          go work edit -replace github.com/skillsgo/skillsgo/protocol="$GITHUB_WORKSPACE/protocol"
          echo "GOWORK=$RUNNER_TEMP/go.work" >> "$GITHUB_ENV"

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build CLI
        run: go build -trimpath -o "$RUNNER_TEMP/skillsgo" ./cmd/skillsgo

  hub:
    name: Hub
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hub
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            hub/go.sum
            protocol/go.sum
            go.work.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build Hub
        run: go build -trimpath -o "$RUNNER_TEMP/skillsgo-hub" ./cmd/skillsgo-hub

  app:
    name: App
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  app-desktop:
    name: App Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: macos
            architecture: arm64
          - name: macOS x64
            os: macos-15-intel
            target: macos
            architecture: x86_64
          - name: Windows x64
            os: windows-2025
            target: windows
          - name: Linux x64
            os: ubuntu-24.04
            target: linux
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            cli/go.sum
            protocol/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Install App dependencies
        run: flutter pub get

      - name: Build architecture-specific macOS App
        if: matrix.target == 'macos'
        run: make -C .. build-app-macos-${{ matrix.architecture }}

      - name: Build desktop App
        if: matrix.target != 'macos'
        run: flutter build ${{ matrix.target }} --release

      - name: Run bundled CLI smoke journey
        if: matrix.target != 'linux'
        run: flutter test -d ${{ matrix.target }} integration_test/bundled_cli_smoke_test.dart

      - name: Run bundled CLI smoke journey under Xvfb
        if: matrix.target == 'linux'
        run: xvfb-run -a flutter test -d linux integration_test/bundled_cli_smoke_test.dart

      - name: Package architecture-specific macOS candidate
        if: matrix.target == 'macos' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          package="SkillsGo_macos_${{ matrix.architecture }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos-${{ matrix.architecture }}/Build/Products/Release/SkillsGo.app" \
            "build/${package}.zip"

      - name: Upload architecture-specific macOS candidate
        if: matrix.target == 'macos' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-macos-${{ matrix.architecture }}
          path: app/build/SkillsGo_macos_${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check content and routes
        run: pnpm typecheck

      - name: Build prerendered site
        run: pnpm build

  e2e-cli:
    name: CLI E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e/cli
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: e2e/cli/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build reusable E2E runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: e2e/cli/Dockerfile
          load: true
          tags: skillsgo-e2e:ci
          cache-from: type=gha,scope=e2e-cli
          cache-to: type=gha,mode=max,scope=e2e-cli,ignore-error=true

      - name: Run cross-product journeys
        env:
          SKILLSGO_E2E_IMAGE: skillsgo-e2e:ci
        run: GOWORK=off go tool gotestsum --format github-actions -- -count=1 -timeout=15m ./...

  e2e-app:
    name: App E2E (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            target: macos
          - name: Windows
            os: windows-2025
            target: windows
          - name: Linux
            os: ubuntu-24.04
            target: linux
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            cli/go.sum
            hub/go.sum
            protocol/go.sum
            go.work.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install App dependencies
        working-directory: app
        run: flutter pub get

      - name: Install macOS PostgreSQL
        if: matrix.target == 'macos'
        run: |
          brew install postgresql@18
          echo "SKILLSGO_E2E_POSTGRES_BIN_DIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"

      - name: Install Linux desktop and PostgreSQL dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb postgresql postgresql-client
          echo "SKILLSGO_E2E_POSTGRES_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"

      - name: Configure Windows PostgreSQL
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          if (-not $env:PGBIN) { throw "The Windows runner does not expose its bundled PostgreSQL binaries." }
          $postgresBin = $env:PGBIN.Replace('\', '/')
          "SKILLSGO_E2E_POSTGRES_BIN_DIR=$postgresBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run rendered desktop journeys
        shell: bash
        env:
          SKILLSGO_E2E_HUB_RUNTIME: native
        run: ./e2e/app/run.sh

  required:
    name: Required
    if: ${{ always() }}
    needs: [dependency-vulnerabilities, protocol, cli, hub, app, app-desktop, web, e2e-cli, e2e-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Require every maintained boundary
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required validation job finished with: ${result}" >&2
              exit 1
            fi
          done

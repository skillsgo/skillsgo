<svg xml:lang="pt-BR" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">SkillsGo Hub é um registro de Packages para Agent Skills</title>
  <desc id="desc">Os repositórios de origem chegam ao SkillsGo Hub, que adiciona descoberta, versões imutáveis, evidências de origem e somas de verificação antes que o App e a CLI instalem Skills exatas nos Coding Agents.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F7F3"/>
      <stop offset="1" stop-color="#EFEEE9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="518" rx="27"
        fill="none" stroke="#D7D7D0" stroke-width="2"/>

  <text x="60" y="58"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" font-weight="650" letter-spacing="1"
        fill="#2D683D">UM REGISTRO DE PACKAGES PARA AGENT SKILLS</text>
  <text x="60" y="105"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="740" letter-spacing="-1"
        fill="#181A18">Pense em npm, Homebrew ou Maven, mas para Skills.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(60 158)">
      <rect width="250" height="240" rx="20" fill="#FFFFFF" stroke="#D7D7D0" stroke-width="2"/>
      <circle cx="42" cy="42" r="18" fill="#ECECE7"/>
      <path d="M34 42h16M42 34v16" stroke="#555B56" stroke-width="2.5" stroke-linecap="round"/>
      <text x="72" y="49" font-size="20" font-weight="720" fill="#181A18">Repositório de origem</text>
      <text x="26" y="91" font-size="15" fill="#666C67">O GitHub continua sendo a fonte da verdade.</text>
      <path d="M26 116H224" stroke="#E3E3DD" stroke-width="2"/>
      <text x="26" y="151" font-size="16" font-weight="650" fill="#343934">Branches mudam</text>
      <text x="26" y="181" font-size="16" font-weight="650" fill="#343934">Tags e commits variam</text>
      <text x="26" y="202" font-size="15" font-weight="650" fill="#343934">Pastas não têm</text>
      <text x="26" y="224" font-size="15" font-weight="650" fill="#343934">identidade de registro</text>
    </g>

    <path d="M326 278H390" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(410 138)">
      <rect width="380" height="280" rx="24" fill="#181A18" stroke="#343834" stroke-width="2"/>
      <rect x="24" y="24" width="150" height="28" rx="14" fill="#DDE9E0"/>
      <circle cx="40" cy="38" r="5" fill="#2D683D"/>
      <text x="54" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" font-weight="650" fill="#244D30">SKILLSGO HUB</text>
      <text x="24" y="91" font-size="25" font-weight="740" fill="#FFFFFF">Limite Package estável</text>
      <g font-size="16" fill="#D5D9D5">
        <text x="24" y="132">✓ Identidade Package pesquisável</text>
        <text x="24" y="166">✓ Package Version imutável</text>
        <text x="24" y="200">✓ Evidência de origem + membros aceitos</text>
        <text x="24" y="234">✓ Soma h1: verificável</text>
      </g>
      <text x="24" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" font-weight="600" fill="#89B893">DESCUBRA POR INTENÇÃO · INSTALE POR IDENTIDADE EXATA</text>
    </g>

    <path d="M810 278H874" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(894 158)">
      <rect width="246" height="240" rx="20" fill="#FFFFFF" stroke="#D7D7D0" stroke-width="2"/>
      <text x="24" y="48" font-size="20" font-weight="720" fill="#181A18">Clientes consistentes</text>
      <g transform="translate(24 72)">
        <rect width="198" height="42" rx="12" fill="#DDE9E0"/>
        <text x="16" y="27" font-size="14" font-weight="700" fill="#214C2D">App para desktop · pessoas</text>
      </g>
      <g transform="translate(24 124)">
        <rect width="198" height="42" rx="12" fill="#ECECE7"/>
        <text x="16" y="27" font-size="16" font-weight="700" fill="#343934">CLI · projetos + CI/CD</text>
      </g>
      <g transform="translate(24 176)">
        <rect width="198" height="42" rx="12" fill="#ECECE7"/>
        <text x="16" y="27" font-size="16" font-weight="700" fill="#343934">Destinos Agent exatos</text>
      </g>
    </g>
  </g>

  <g transform="translate(60 452)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="13" font-weight="650">
    <rect width="132" height="34" rx="17" fill="#ECECE7"/>
    <text x="66" y="22" text-anchor="middle" fill="#555B56">registro npm</text>
    <rect x="144" width="142" height="34" rx="17" fill="#ECECE7"/>
    <text x="215" y="22" text-anchor="middle" fill="#555B56">tap do Homebrew</text>
    <rect x="298" width="168" height="34" rx="17" fill="#ECECE7"/>
    <text x="382" y="22" text-anchor="middle" fill="#555B56">repositório Maven</text>
    <text x="1120" y="22" text-anchor="end" font-size="11" fill="#2D683D">FUNÇÃO FAMILIAR · PROTOCOLO ESPECÍFICO PARA SKILLS</text>
  </g>
</svg>

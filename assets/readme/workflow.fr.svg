<svg xml:lang="fr" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">Fonctionnement de SkillsGo</title>
  <desc id="desc">Cinq étapes présentent le parcours partagé d’un Skill : l’App de bureau sert l’usage personnel interactif et la CLI l’automatisation CI/CD et les environnements cohérents ; toutes deux se connectent au SkillsGo Hub.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#181A18"/>
  <rect x="1" y="1" width="1198" height="428" rx="27"
        fill="none" stroke="#343834" stroke-width="2"/>

  <text x="60" y="66"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="650" letter-spacing="1"
        fill="#89B893">LE PARCOURS GÉRÉ D’UN SKILL</text>
  <text x="60" y="115"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="720" letter-spacing="-1"
        fill="#F7F6F1">D’une version publique à des cibles locales explicites.</text>

  <path d="M150 215H1050" stroke="#4B514C" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(60 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">01</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Découvrir</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Recherche, classement,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">tendances et Hot.</text>
    </g>

    <path d="M210 215H270" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(270 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">02</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Inspecter</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Vérifier source, version,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">fichiers et risques.</text>
    </g>

    <path d="M420 215H480" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(480 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">03</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Cibler</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Choisir des cibles Agent</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">globales ou par projet.</text>
    </g>

    <path d="M630 215H690" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(690 170)">
      <circle cx="90" cy="45" r="32" fill="#2D683D"/>
      <path d="M69 45L83 58L105 34" fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Installer</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Vérifier localement</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">l’artefact immuable.</text>
    </g>

    <path d="M840 215H900" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(900 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">05</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Gérer</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Inspecter, update, remove,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">retirer ou adopter des Skills.</text>
    </g>
  </g>

  <g transform="translate(60 382)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="13" font-weight="600" fill="#8F9690">
    <text x="0" y="0">APP DE BUREAU → UTILISATEURS</text>
    <text x="276" y="0">CLI → CI/CD + ENVIRONNEMENTS COHÉRENTS</text>
    <text x="1080" y="0" text-anchor="end" fill="#89B893">LES DEUX → SKILLSGO HUB</text>
  </g>
</svg>

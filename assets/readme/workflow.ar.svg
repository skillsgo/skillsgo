<svg xml:lang="ar" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">كيف يعمل SkillsGo</title>
  <desc id="desc">خمس مراحل توضح رحلة Skill المشتركة من الاكتشاف إلى الإدارة. يخدم App الاستخدام الشخصي التفاعلي، ويخدم CLI أتمتة CI/CD والبيئات المتسقة، ويتصل كلاهما بـ SkillsGo Hub.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#181A18"/>
  <rect x="1" y="1" width="1198" height="428" rx="27"
        fill="none" stroke="#343834" stroke-width="2"/>

  <text x="1140" y="66" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
        font-family="'Noto Sans Arabic', Arial, sans-serif"
        font-size="15" font-weight="700" fill="#89B893">رحلة SKILL المُدارة</text>
  <text x="1140" y="115" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
        font-family="'Noto Sans Arabic', Arial, sans-serif"
        font-size="36" font-weight="720" fill="#F7F6F1">من إصدار عام إلى أهداف محلية محددة.</text>

  <path d="M150 215H1050" stroke="#4B514C" stroke-width="3"/>

  <g font-family="'Noto Sans Arabic', Arial, sans-serif">
    <g transform="translate(900 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="750" fill="#214C2D">01</text>
      <text x="180" y="116" text-anchor="start" direction="rtl" font-size="20" font-weight="700" fill="#FFFFFF">اكتشف</text>
      <text x="180" y="146" text-anchor="start" direction="rtl" font-size="16" fill="#B6BCB7">البحث والترتيب</text>
      <text x="180" y="170" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="16" fill="#B6BCB7">والرائج وHot.</text>
    </g>

    <path d="M900 215H840" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(690 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="750" fill="#214C2D">02</text>
      <text x="180" y="116" text-anchor="start" direction="rtl" font-size="20" font-weight="700" fill="#FFFFFF">افحص</text>
      <text x="180" y="146" text-anchor="start" direction="rtl" font-size="16" fill="#B6BCB7">راجع المصدر والإصدار</text>
      <text x="180" y="170" text-anchor="start" direction="rtl" font-size="16" fill="#B6BCB7">والملفات والمخاطر.</text>
    </g>

    <path d="M690 215H630" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(480 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="750" fill="#214C2D">03</text>
      <text x="180" y="116" text-anchor="start" direction="rtl" font-size="20" font-weight="700" fill="#FFFFFF">حدّد الأهداف</text>
      <text x="180" y="146" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="16" fill="#B6BCB7">اختر النطاق العام أو المشروع</text>
      <text x="180" y="170" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="16" fill="#B6BCB7">ووجهات Agent.</text>
    </g>

    <path d="M480 215H420" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(270 170)">
      <circle cx="90" cy="45" r="32" fill="#2D683D"/>
      <path d="M69 45L83 58L105 34" fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="180" y="116" text-anchor="start" direction="rtl" font-size="20" font-weight="700" fill="#FFFFFF">ثبّت</text>
      <text x="180" y="146" text-anchor="start" direction="rtl" font-size="16" fill="#B6BCB7">تحقق محليًا من العنصر</text>
      <text x="180" y="170" text-anchor="start" direction="rtl" font-size="16" fill="#B6BCB7">غير القابل للتغيير.</text>
    </g>

    <path d="M270 215H210" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(60 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="750" fill="#214C2D">05</text>
      <text x="180" y="116" text-anchor="start" direction="rtl" font-size="20" font-weight="700" fill="#FFFFFF">أدِر</text>
      <text x="180" y="146" text-anchor="start" direction="rtl" font-size="16" fill="#B6BCB7">افحص وحدّث واحذف</text>
      <text x="180" y="170" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="16" fill="#B6BCB7">أو تبنَّ Skills خارجية.</text>
    </g>
  </g>

  <g transform="translate(60 382)"
     font-family="'Noto Sans Arabic', Arial, sans-serif"
     font-size="14" font-weight="600" fill="#8F9690">
    <text x="1080" y="0" text-anchor="start" direction="rtl" unicode-bidi="plaintext">APP لسطح المكتب ← المستخدمون</text>
    <text x="790" y="0" text-anchor="start" direction="rtl" unicode-bidi="plaintext">CLI ← CI/CD + بيئات متسقة</text>
    <text x="300" y="0" text-anchor="start" direction="rtl" unicode-bidi="plaintext" fill="#89B893">كلاهما ← SKILLSGO HUB</text>
  </g>
</svg>

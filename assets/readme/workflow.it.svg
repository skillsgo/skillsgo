<svg xml:lang="it" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">Come funziona SkillsGo</title>
  <desc id="desc">Cinque fasi mostrano il percorso condiviso di uno Skill: l’App desktop serve l’uso personale interattivo e la CLI l’automazione CI/CD e gli ambienti coerenti; entrambe si collegano a SkillsGo Hub.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#181A18"/>
  <rect x="1" y="1" width="1198" height="428" rx="27"
        fill="none" stroke="#343834" stroke-width="2"/>

  <text x="60" y="66"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="650" letter-spacing="1"
        fill="#89B893">IL PERCORSO GESTITO DI UNO SKILL</text>
  <text x="60" y="115"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="720" letter-spacing="-1"
        fill="#F7F6F1">Da una versione pubblica a target locali espliciti.</text>

  <path d="M150 215H1050" stroke="#4B514C" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(60 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">01</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Scopri</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Ricerca, classifica,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">tendenze e Hot.</text>
    </g>

    <path d="M210 215H270" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(270 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">02</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Ispeziona</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Controlla origine, versione,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">file e rischi.</text>
    </g>

    <path d="M420 215H480" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(480 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">03</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Scegli i target</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Scegli target Agent</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">globali o di progetto.</text>
    </g>

    <path d="M630 215H690" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(690 170)">
      <circle cx="90" cy="45" r="32" fill="#2D683D"/>
      <path d="M69 45L83 58L105 34" fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Installa</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Verifica localmente</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">l’artefatto immutabile.</text>
    </g>

    <path d="M840 215H900" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(900 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">05</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Gestisci</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Ispeziona, update, remove,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">o adotta Skill esterni.</text>
    </g>
  </g>

  <g transform="translate(60 382)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="13" font-weight="600" fill="#8F9690">
    <text x="0" y="0">APP DESKTOP → PERSONE</text>
    <text x="276" y="0">CLI → CI/CD + AMBIENTI COERENTI</text>
    <text x="1080" y="0" text-anchor="end" fill="#89B893">ENTRAMBE → SKILLSGO HUB</text>
  </g>
</svg>

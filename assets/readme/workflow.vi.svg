<svg xml:lang="vi" xmlns="http://www.w3.org/2000/svg"

     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">Cách SkillsGo hoạt động</title>
  <desc id="desc">Năm giai đoạn thể hiện hành trình Skill chung: App máy tính phục vụ người dùng cá nhân, còn CLI phục vụ tự động hóa CI/CD và môi trường nhất quán; cả hai kết nối với SkillsGo Hub.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#181A18"/>
  <rect x="1" y="1" width="1198" height="428" rx="27"
        fill="none" stroke="#343834" stroke-width="2"/>

  <text x="60" y="66"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="650" letter-spacing="1"
        fill="#89B893">HÀNH TRÌNH SKILL ĐƯỢC QUẢN LÝ</text>
  <text x="60" y="115"
        font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="720" letter-spacing="-1"
        fill="#F7F6F1">Từ bản phát hành công khai đến đích cục bộ rõ ràng.</text>

  <path d="M150 215H1050" stroke="#4B514C" stroke-width="3"/>

  <g font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(60 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">01</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Khám phá</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Tìm kiếm, xếp hạng,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">xu hướng và Hot.</text>
    </g>

    <path d="M210 215H270" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(270 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">02</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Kiểm tra</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Xem nguồn, phiên bản,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">tệp và rủi ro.</text>
    </g>

    <path d="M420 215H480" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(480 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">03</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Chọn đích</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Chọn đích Agent toàn cục</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">hoặc theo dự án.</text>
    </g>

    <path d="M630 215H690" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(690 170)">
      <circle cx="90" cy="45" r="32" fill="#2D683D"/>
      <path d="M69 45L83 58L105 34" fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Cài đặt</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Xác minh artifact bất biến</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">ở máy cục bộ.</text>
    </g>

    <path d="M840 215H900" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(900 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">05</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Quản lý</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Kiểm tra, cập nhật, xóa,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">hoặc nhận Skill bên ngoài.</text>
    </g>
  </g>

  <g transform="translate(60 382)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="13" font-weight="600" fill="#8F9690">
    <text x="0" y="0">APP MÁY TÍNH → NGƯỜI DÙNG</text>
    <text x="276" y="0">CLI → CI/CD + MÔI TRƯỜNG NHẤT QUÁN</text>
    <text x="1080" y="0" text-anchor="end" fill="#89B893">CẢ HAI → SKILLSGO HUB</text>
  </g>
</svg>

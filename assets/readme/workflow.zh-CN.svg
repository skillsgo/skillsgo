<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">SkillsGo 的工作方式</title>
  <desc id="desc">五个阶段展示统一的 Skill 流程：桌面 App 面向个人交互使用，CLI 面向 CI/CD 自动化和一致环境；两者都连接 SkillsGo Hub。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#181A18"/>
  <rect x="1" y="1" width="1198" height="428" rx="27"
        fill="none" stroke="#343834" stroke-width="2"/>

  <text x="60" y="66"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="650" letter-spacing="1"
        fill="#89B893">受管理的 SKILL 流程</text>
  <text x="60" y="115"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="38" font-weight="720" letter-spacing="-1"
        fill="#F7F6F1">从公开版本到明确的本地目标。</text>

  <path d="M150 215H1050" stroke="#4B514C" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(60 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">01</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">发现</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">搜索、排名、</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">趋势与热门 Skill。</text>
    </g>

    <path d="M210 215H270" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(270 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">02</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">检查</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">查看来源、版本、</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">文件与风险。</text>
    </g>

    <path d="M420 215H480" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(480 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">03</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">选择目标</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">选择全局或项目中的</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">Agent 安装目标。</text>
    </g>

    <path d="M630 215H690" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(690 170)">
      <circle cx="90" cy="45" r="32" fill="#2D683D"/>
      <path d="M69 45L83 58L105 34" fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">安装</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">在本地验证</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">不可变工件。</text>
    </g>

    <path d="M840 215H900" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(900 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">05</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">管理</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">检查、更新、移除，</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">或接管外部 Skill。</text>
    </g>
  </g>

  <g transform="translate(60 382)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="14" font-weight="600" fill="#8F9690">
    <text x="0" y="0">桌面 APP → 用户</text>
    <text x="276" y="0">CLI → CI/CD + 一致环境</text>
    <text x="1080" y="0" text-anchor="end" fill="#89B893">两者 → SKILLSGO HUB</text>
  </g>
</svg>

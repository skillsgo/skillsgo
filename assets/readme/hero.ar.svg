<svg xml:lang="ar" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">SkillsGo — اكتشف Agent Skills وتحقق منها وأدرها</title>
  <desc id="desc">خريطة للنظام توضح أن SkillsGo Hub يخدم مسارين متوازيين: App لسطح المكتب مخصص للمستخدمين وCLI مخصص لـ CI/CD وبيئات Skills المتسقة.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F7F3"/>
      <stop offset="1" stop-color="#EFEEE9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#C8C8C0"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="398" rx="27"
        fill="none" stroke="#D7D7D0" stroke-width="2"/>
  <path d="M704 0H1200V400H704Z" fill="url(#dots)" opacity=".58"/>

  <g id="title-block" transform="translate(64 58)">
    <g>
      <rect width="192" height="30" rx="15" fill="#DDE9E0"/>
      <circle cx="175" cy="15" r="5" fill="#2D683D"/>
      <text x="160" y="20" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
            font-family="'Noto Sans Arabic', Arial, sans-serif"
            font-size="13" font-weight="700" fill="#244D30">AGENT SKILLS مفتوحة</text>
    </g>

    <text x="0" y="116"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="72" font-weight="760" letter-spacing="-3"
          fill="#181A18">SkillsGo</text>
    <text x="548" y="164" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
          font-family="'Noto Sans Arabic', Arial, sans-serif"
          font-size="24" font-weight="600" fill="#3E433F">اكتشف Agent Skills وتحقق منها وأدرها.</text>

    <path d="M0 204H548" stroke="#CBCBC4" stroke-width="2"/>
    <g transform="translate(0 232)"
       font-family="'Noto Sans Arabic', Arial, sans-serif"
       font-size="14" font-weight="700" fill="#5F655F">
      <text x="0" y="0">APP لسطح المكتب</text>
      <text x="154" y="0">GO CLI</text>
      <text x="258" y="0">HUB عام</text>
      <text x="404" y="0">APACHE-2.0</text>
    </g>
    <text x="548" y="292" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
          font-family="'Noto Sans Arabic', Arial, sans-serif"
          font-size="16" fill="#6D726D">إدارة محلية أولًا. إصدارات ثابتة. أهداف محددة.</text>
  </g>

  <g id="product-paths" transform="translate(704 40)">
    <text x="480" y="18" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
          font-family="'Noto Sans Arabic', Arial, sans-serif"
          font-size="13" font-weight="700" fill="#6B716C">HUB واحد · مساران مصممان لغرضين</text>

    <g transform="translate(118 44)">
      <rect width="244" height="72" rx="16" fill="#DDE9E0" stroke="#2D683D" stroke-width="2"/>
      <path d="M20 25H52M20 36H52M20 47H52" stroke="#2D683D"
            stroke-width="3" stroke-linecap="round"/>
      <circle cx="27" cy="25" r="3" fill="#2D683D"/>
      <circle cx="43" cy="36" r="3" fill="#2D683D"/>
      <circle cx="32" cy="47" r="3" fill="#2D683D"/>
      <text x="68" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" font-weight="700" fill="#173C22">SkillsGo Hub</text>
      <text x="222" y="53" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
            font-family="'Noto Sans Arabic', Arial, sans-serif"
            font-size="12" font-weight="600" fill="#315B3C">إصدارات Skills متحقق منها</text>
    </g>

    <path d="M240 122V150M240 150H108M240 150H372"
          fill="none" stroke="#2D683D" stroke-width="3"/>
    <path d="M108 150V172M372 150V172"
          stroke="#2D683D" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(0 182)">
      <rect width="216" height="92" rx="16" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="2"/>
      <rect x="16" y="16" width="48" height="48" rx="12" fill="#2D683D"/>
      <rect x="26" y="26" width="28" height="22" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M34 55H46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="198" y="34" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
            font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="16" font-weight="700" fill="#1C201D">App لسطح المكتب</text>
      <text x="198" y="57" text-anchor="start" direction="rtl"
            font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="12" fill="#737973">للمستخدمين</text>
      <text x="108" y="80" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
            font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="12" fill="#5F655F">اكتشاف · فحص · إدارة</text>
    </g>

    <g transform="translate(264 182)">
      <rect width="216" height="92" rx="16" fill="#181A18"/>
      <circle cx="40" cy="40" r="22" fill="#2D683D"/>
      <path d="M31 34L39 40L31 46M43 47H52" fill="none" stroke="#FFFFFF"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="198" y="34" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
            font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">SkillsGo CLI</text>
      <text x="198" y="57" text-anchor="start" direction="rtl"
            font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="12" fill="#B8BDB8">لـ CI/CD</text>
      <text x="108" y="80" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
            font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="12" fill="#B8BDB8">أتمتة · اتساق · تكرار</text>
    </g>

    <path d="M108 280V288M372 280V288M108 288H372"
          fill="none" stroke="#2D683D" stroke-width="3"/>
    <path d="M240 288V302" stroke="#2D683D" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(92 310)">
      <rect width="296" height="46" rx="14" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="2"/>
      <circle cx="272" cy="23" r="8" fill="#2D683D"/>
      <text x="252" y="29" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
            font-family="'Noto Sans Arabic', Arial, sans-serif"
            font-size="15" font-weight="700" fill="#242824">Skills متسقة عبر مختلف Agents</text>
    </g>
  </g>
</svg>

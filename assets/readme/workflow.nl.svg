<svg xml:lang="nl" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">Zo werkt SkillsGo</title>
  <desc id="desc">Vijf fasen tonen het gedeelde Skill-traject: de desktop-app ondersteunt interactief persoonlijk gebruik en de CLI ondersteunt CI/CD-automatisering en consistente omgevingen; beide verbinden met de SkillsGo Hub.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#181A18"/>
  <rect x="1" y="1" width="1198" height="428" rx="27"
        fill="none" stroke="#343834" stroke-width="2"/>

  <text x="60" y="66"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="650" letter-spacing="1"
        fill="#89B893">HET BEHEERDE SKILL-TRAJECT</text>
  <text x="60" y="115"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="35" font-weight="720" letter-spacing="-1"
        fill="#F7F6F1">Van een openbare release naar expliciete lokale doelen.</text>

  <path d="M150 215H1050" stroke="#4B514C" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(60 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">01</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Ontdek</text>
      <text x="0" y="146" font-size="15" fill="#B6BCB7">Zoeken, rangschikking,</text>
      <text x="0" y="170" font-size="15" fill="#B6BCB7">trending en Hot.</text>
    </g>

    <path d="M210 215H270" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(270 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">02</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Inspecteer</text>
      <text x="0" y="146" font-size="15" fill="#B6BCB7">Bekijk bron, versie,</text>
      <text x="0" y="170" font-size="15" fill="#B6BCB7">bestanden en risico.</text>
    </g>

    <path d="M420 215H480" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(480 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">03</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Kies doelen</text>
      <text x="0" y="146" font-size="15" fill="#B6BCB7">Kies globale of project-</text>
      <text x="0" y="170" font-size="15" fill="#B6BCB7">gebonden Agent-doelen.</text>
    </g>

    <path d="M630 215H690" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(690 170)">
      <circle cx="90" cy="45" r="32" fill="#2D683D"/>
      <path d="M69 45L83 58L105 34" fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Installeer</text>
      <text x="0" y="146" font-size="15" fill="#B6BCB7">Verifieer het onveranderlijke</text>
      <text x="0" y="170" font-size="15" fill="#B6BCB7">artefact lokaal.</text>
    </g>

    <path d="M840 215H900" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(900 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">05</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Beheer</text>
      <text x="0" y="146" font-size="15" fill="#B6BCB7">Inspecteereer, update, verwijder</text>
      <text x="0" y="170" font-size="15" fill="#B6BCB7">of adopteer externe Skills.</text>
    </g>
  </g>

  <g transform="translate(60 382)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="12" font-weight="600" fill="#8F9690">
    <text x="0" y="0">DESKTOP-APP → MENSEN</text>
    <text x="260" y="0">CLI → CI/CD + CONSISTENTE OMGEVINGEN</text>
    <text x="1080" y="0" text-anchor="end" fill="#89B893">BEIDE → SKILLSGO HUB</text>
  </g>
</svg>

<svg xml:lang="ar" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">SkillsGo Hub هو سجل حزم لـ Agent Skills</title>
  <desc id="desc">تنتقل مستودعات المصدر إلى SkillsGo Hub، الذي يضيف قابلية الاكتشاف والإصدارات غير القابلة للتغيير وأدلة المصدر وقيم التحقق، قبل أن يثبت App وCLI وحدات Skills المحددة بدقة لدى Coding Agents.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F7F3"/>
      <stop offset="1" stop-color="#EFEEE9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="518" rx="27"
        fill="none" stroke="#D7D7D0" stroke-width="2"/>

  <text x="1140" y="58" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
        font-family="'Noto Sans Arabic', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#2D683D">سجل حزم لـ AGENT SKILLS</text>
  <text x="1140" y="105" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
        font-family="'Noto Sans Arabic', Arial, sans-serif"
        font-size="35" font-weight="740" fill="#181A18">فكّر في npm أو Homebrew أو Maven، ولكن لـ Skills.</text>

  <g font-family="'Noto Sans Arabic', Arial, sans-serif">
    <g transform="translate(890 158)">
      <rect width="250" height="240" rx="20" fill="#FFFFFF" stroke="#D7D7D0" stroke-width="2"/>
      <circle cx="208" cy="42" r="18" fill="#ECECE7"/>
      <path d="M200 42h16M208 34v16" stroke="#555B56" stroke-width="2.5" stroke-linecap="round"/>
      <text x="180" y="49" text-anchor="start" direction="rtl" font-size="20" font-weight="720" fill="#181A18">مستودع المصدر</text>
      <text x="224" y="91" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="15" fill="#666C67">يبقى GitHub مصدر الحقيقة.</text>
      <path d="M26 116H224" stroke="#E3E3DD" stroke-width="2"/>
      <text x="224" y="151" text-anchor="start" direction="rtl" font-size="16" font-weight="650" fill="#343934">الفروع تتغير</text>
      <text x="224" y="181" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="16" font-weight="650" fill="#343934">تختلف tags وcommits</text>
      <text x="224" y="211" text-anchor="start" direction="rtl" font-size="15" font-weight="650" fill="#343934">المجلدات بلا هوية في السجل</text>
    </g>

    <path d="M874 278H810" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(410 138)">
      <rect width="380" height="280" rx="24" fill="#181A18" stroke="#343834" stroke-width="2"/>
      <rect x="206" y="24" width="150" height="28" rx="14" fill="#DDE9E0"/>
      <circle cx="340" cy="38" r="5" fill="#2D683D"/>
      <text x="326" y="43" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
            font-size="12" font-weight="700" fill="#244D30">SKILLSGO HUB</text>
      <text x="356" y="91" text-anchor="start" direction="rtl" font-size="25" font-weight="740" fill="#FFFFFF">حد ثابت للحزم</text>
      <g font-size="16" fill="#D5D9D5">
        <text x="356" y="132" text-anchor="start" direction="rtl" unicode-bidi="plaintext">✓ هوية Package قابلة للاكتشاف</text>
        <text x="356" y="166" text-anchor="start" direction="rtl" unicode-bidi="plaintext">✓ Package Version غير قابل للتغيير</text>
        <text x="356" y="200" text-anchor="start" direction="rtl" unicode-bidi="plaintext">✓ دليل المصدر + أعضاء معتمدون</text>
        <text x="356" y="234" text-anchor="start" direction="rtl" unicode-bidi="plaintext">✓ قيمة تحقق h1: قابلة للتحقق</text>
      </g>
      <text x="356" y="261" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
            font-size="11" font-weight="700" fill="#89B893">اكتشف حسب الغرض · ثبّت بالهوية الدقيقة</text>
    </g>

    <path d="M390 278H326" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(60 158)">
      <rect width="250" height="240" rx="20" fill="#FFFFFF" stroke="#D7D7D0" stroke-width="2"/>
      <text x="226" y="48" text-anchor="start" direction="rtl" font-size="20" font-weight="720" fill="#181A18">مستهلكون متسقون</text>
      <g transform="translate(24 72)">
        <rect width="202" height="42" rx="12" fill="#DDE9E0"/>
        <text x="186" y="27" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="15" font-weight="700" fill="#214C2D">Desktop App · المستخدمون</text>
      </g>
      <g transform="translate(24 124)">
        <rect width="202" height="42" rx="12" fill="#ECECE7"/>
        <text x="186" y="27" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="15" font-weight="700" fill="#343934">CLI · المشاريع + CI/CD</text>
      </g>
      <g transform="translate(24 176)">
        <rect width="202" height="42" rx="12" fill="#ECECE7"/>
        <text x="186" y="27" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="15" font-weight="700" fill="#343934">أهداف Agent محددة</text>
      </g>
    </g>
  </g>

  <g transform="translate(60 452)"
     font-family="'Noto Sans Arabic', Arial, sans-serif"
     font-size="13" font-weight="650">
    <rect x="988" width="132" height="34" rx="17" fill="#ECECE7"/>
    <text x="1054" y="22" text-anchor="middle" fill="#555B56">سجل npm</text>
    <rect x="834" width="142" height="34" rx="17" fill="#ECECE7"/>
    <text x="905" y="22" text-anchor="middle" fill="#555B56">Homebrew tap</text>
    <rect x="654" width="168" height="34" rx="17" fill="#ECECE7"/>
    <text x="738" y="22" text-anchor="middle" fill="#555B56">مستودع Maven</text>
    <text x="390" y="22" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="11" fill="#2D683D">دور مألوف · بروتوكول خاص بـ SKILLS</text>
  </g>
</svg>

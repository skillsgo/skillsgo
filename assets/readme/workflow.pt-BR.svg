<svg xml:lang="pt-BR" xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">Como o SkillsGo funciona</title>
  <desc id="desc">Cinco etapas mostram a jornada compartilhada de uma Skill: o App para desktop atende ao uso pessoal interativo e a CLI à automação de CI/CD e aos ambientes consistentes; ambos se conectam ao SkillsGo Hub.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2D683D"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#181A18"/>
  <rect x="1" y="1" width="1198" height="428" rx="27"
        fill="none" stroke="#343834" stroke-width="2"/>

  <text x="60" y="66"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="650" letter-spacing="1"
        fill="#89B893">A JORNADA GERENCIADA DE UMA SKILL</text>
  <text x="60" y="115"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="720" letter-spacing="-1"
        fill="#F7F6F1">De uma versão pública a destinos locais explícitos.</text>

  <path d="M150 215H1050" stroke="#4B514C" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(60 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">01</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Descobrir</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Busca, classificação,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">tendências e Hot.</text>
    </g>

    <path d="M210 215H270" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(270 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">02</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Revisar</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Revisar origem, versão,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">arquivos e riscos.</text>
    </g>

    <path d="M420 215H480" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(480 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">03</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Definir destinos</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Escolher destinos Agent</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">globais ou por projeto.</text>
    </g>

    <path d="M630 215H690" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(690 170)">
      <circle cx="90" cy="45" r="32" fill="#2D683D"/>
      <path d="M69 45L83 58L105 34" fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Instalar</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Verificar localmente</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">o artefato imutável.</text>
    </g>

    <path d="M840 215H900" stroke="#2D683D" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(900 170)">
      <circle cx="90" cy="45" r="32" fill="#DDE9E0"/>
      <text x="90" y="53" text-anchor="middle" font-size="22" font-weight="750" fill="#214C2D">05</text>
      <text x="0" y="116" font-size="20" font-weight="700" fill="#FFFFFF">Gerenciar</text>
      <text x="0" y="146" font-size="16" fill="#B6BCB7">Revisar, update, remove,</text>
      <text x="0" y="170" font-size="16" fill="#B6BCB7">ou adotar Skills externas.</text>
    </g>
  </g>

  <g transform="translate(60 382)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="13" font-weight="600" fill="#8F9690">
    <text x="0" y="0">APP PARA DESKTOP → PESSOAS</text>
    <text x="276" y="0">CLI → CI/CD + AMBIENTES CONSISTENTES</text>
    <text x="1080" y="0" text-anchor="end" fill="#89B893">AMBOS → SKILLSGO HUB</text>
  </g>
</svg>
